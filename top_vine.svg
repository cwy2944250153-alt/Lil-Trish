<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 108" preserveAspectRatio="none">
  <!-- Misty vine line: only decoration. Different artwork from the peony music player. -->
  <defs>
    <linearGradient id="twig" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8eafb0" stop-opacity=".08"/>
      <stop offset=".19" stop-color="#a9aaa1" stop-opacity=".55"/>
      <stop offset=".53" stop-color="#b58c9c" stop-opacity=".26"/>
      <stop offset=".81" stop-color="#afaaa2" stop-opacity=".54"/>
      <stop offset="1" stop-color="#8ea5a2" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="petal" cx="37%" cy="30%" r="75%">
      <stop offset="0" stop-color="#f2e9e2" stop-opacity=".85"/>
      <stop offset=".72" stop-color="#d3b7c1" stop-opacity=".65"/>
      <stop offset="1" stop-color="#a0a9a7" stop-opacity=".45"/>
    </radialGradient>
    <g id="sprig">
      <path d="M-23 4Q0 -14 28 -8" stroke="url(#twig)" stroke-width="2.4" fill="none"/>
      <path d="M-11 -1 Q-25 -24 -32 -13 Q-26 -3 -11 -1Z" fill="#b7c4bd" opacity=".50"/>
      <path d="M7 -5 Q13 -29 25 -19 Q19 -6 7 -5Z" fill="#c7bbb7" opacity=".49"/>
      <path d="M16 -7 Q34 7 38 -3 Q26 -14 16 -7Z" fill="#afbfb7" opacity=".48"/>
    </g>
    <g id="small-flower">
      <path d="M0 -3 C-12 -11 -10 -21 0 -18 C7 -22 11 -13 4 -6 C19 -12 22 -4 10 2 C18 9 9 16 1 8 C-7 18 -17 10 -10 1 C-21 -4 -14 -14 0 -3 Z" fill="url(#petal)" stroke="#d2b9c2" stroke-opacity=".34" stroke-width=".5"/>
      <circle r="2.2" cx="0" cy="-1" fill="#ccb9a5" opacity=".6"/>
    </g>
  </defs>
  <!-- Uneven, partly broken, winding stems are intentional: avoid a mechanical horizontal border. -->
  <path d="M-28 55 C95 36 153 78 239 62 S415 42 507 64" stroke="url(#twig)" stroke-width="2.7" fill="none" opacity=".68"/>
  <path d="M537 63 C615 42 674 78 783 60 S966 43 1114 61" stroke="url(#twig)" stroke-width="2.6" fill="none" opacity=".62"/>
  <path d="M89 70 C155 88 175 84 224 68 M804 60 C839 82 901 75 942 67" stroke="#c0b7b7" stroke-width="1.3" stroke-opacity=".34" fill="none"/>
  <use href="#sprig" transform="translate(112 61) rotate(-13) scale(1.0)"/>
  <use href="#sprig" transform="translate(334 53) rotate(164) scale(.82)"/>
  <use href="#sprig" transform="translate(468 61) rotate(8) scale(.70)"/>
  <use href="#sprig" transform="translate(637 57) rotate(159) scale(.75)"/>
  <use href="#sprig" transform="translate(870 59) rotate(12) scale(1.04)"/>
  <use href="#sprig" transform="translate(1020 53) rotate(170) scale(.68)"/>
  <use href="#small-flower" transform="translate(177 66) rotate(9) scale(.91)"/>
  <use href="#small-flower" transform="translate(430 56) rotate(-22) scale(.77)"/>
  <use href="#small-flower" transform="translate(718 61) rotate(15) scale(.9)"/>
  <use href="#small-flower" transform="translate(967 55) rotate(-12) scale(.67)"/>
  <path d="M270 62 Q276 55 281 62 Q276 71 270 62 M586 60 Q595 47 602 61 Q595 73 586 60" fill="#d9c8c3" opacity=".44"/>
